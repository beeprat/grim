# Builds grim. for Linux on every push and packs it as an AppImage (download it from the run's
# "Artifacts"). Ubuntu 22.04 keeps the glibc requirement low, so the AppImage runs on most distributions.
name: Linux AppImage

on:
  push:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config file libfuse2 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libfreetype6-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libpulse0 libasound2 \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -- -k 0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Pack AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: svg;dbus
          LDAI_OUTPUT: grim-x86_64.AppImage
        run: |
          # Wayland as well as X11 (the plugin names changed in Qt 6.10, so take whatever is there).
          export EXTRA_PLATFORM_PLUGINS=$(cd "$QT_ROOT_DIR/plugins/platforms" && ls libqwayland*.so | paste -sd ';')
          echo "Wayland plugins: $EXTRA_PLATFORM_PLUGINS"
          DESTDIR=AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/GRIM \
            --desktop-file resources/linux/grim.desktop --icon-file resources/linux/grim.svg \
            --plugin qt --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: grim-x86_64.AppImage
          path: grim-x86_64.AppImage
          if-no-files-found: error
