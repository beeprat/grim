# Builds grim. for Windows on every push: GRIM-win64.7z and grim-setup.exe (download them from the run's
# "Artifacts"). Pushing a tag like v0.2.0 also adds both to the GitHub Release (the Linux workflow adds the AppImage).
# Packaging follows CLAUDE.md "Distribution".
name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write # the release step
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja, NSIS and ffmpeg
        run: choco install ninja nsis ffmpeg -y --no-progress

      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/release --output-on-failure

      - name: Pack
        shell: pwsh
        run: |
          $dist = "dist/GRIM"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/release/GRIM.exe $dist
          windeployqt --release --qmldir qml --no-translations --no-opengl-sw --no-system-d3d-compiler "$dist/GRIM.exe"

          # Trim what grim. never loads.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "$dist/dxcompiler.dll", "$dist/dxil.dll", "$dist/qmltooling", "$dist/generic",
            "$dist/qml/QtQuick/NativeStyle", "$dist/qml/QtQuick/Particles", "$dist/qml/QtQuick/LocalStorage",
            "$dist/qml/QtQuick/VectorImage", "$dist/qml/QtQuick/tooling", "$dist/qml/QtQml/XmlListModel"
          Get-ChildItem "$dist/sqldrivers" -Filter *.dll | Where-Object Name -ne "qsqlite.dll" | Remove-Item -Force
          foreach ($style in "Fusion", "Imagine", "Universal", "FluentWinUI3", "Windows") {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$dist/qml/QtQuick/Controls/$style"
            Remove-Item -Force -ErrorAction SilentlyContinue "$dist/Qt6QuickControls2$style*.dll"
          }

          # The C++ runtime app-locally, so no VC++ redistributable is needed.
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)/msvcp140*.dll", "$($crt.FullName)/vcruntime140*.dll" $dist

          Push-Location dist; 7z a -t7z -mx=9 -md=64m -ms=on GRIM-win64.7z GRIM; Pop-Location
          makensis installer/grim.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: grim-windows
          path: |
            dist/GRIM-win64.7z
            dist/grim-setup.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GRIM-win64.7z
            dist/grim-setup.exe
